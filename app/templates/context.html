{% extends "base.html" %}
{% block title %}Раунд #{{ round.number }}, контекст{% endblock %}
{% block content %}
<div class="titlebar">
	<h1>Раунд #{{ round.number }} <span class="muted">контекст</span></h1>
	<nav class="modes">
		<a class="mode" href="{{ request.scope.root_path }}/round/{{ round.number }}">Поиск по тексту</a>
		<a class="mode" href="{{ request.scope.root_path }}/round/{{ round.number }}/map?anchor={{ focus }}&tstart={{ offset }}&tend={{ offset }}">Карта</a>
	</nav>
</div>
<table class="log">
	{% for e in entries %}
	<tr class="cat-{{ e.cat.split('-')[0] }} {% if e.index == focus %}focus{% endif %}" id="e{{ e.index }}">
		<td class="time"><a href="{{ request.scope.root_path }}/round/{{ round.number }}/context/{{ e.index }}">{{ e.time }}</a></td>
		<td class="cat">{{ e.cat }}</td>
		<td class="msg">{{ e.msg }}</td>
	</tr>
	{% endfor %}
</table>
<script>document.getElementById("e{{ focus }}")?.scrollIntoView({block: "center"});</script>
{% endblock %}
